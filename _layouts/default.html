<!DOCTYPE html>
<html lang="en" data-baseurl="{{ site.baseurl }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | prepend: site.baseurl }}">
</head>
<body>
  <nav class="site-nav">
    <a href="{{ site.baseurl }}/" class="nav-brand">{{ site.title }}</a>
  </nav>
  <main>
    {{ content }}
  </main>
  <footer class="site-footer">
    <span>{{ site.title }}</span>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/lunr@2.3.9/lunr.min.js"></script>
  {% if page.layout == 'home' %}
  <script src="{{ '/assets/js/search.js' | prepend: site.baseurl }}"></script>
  {% endif %}
</body>
</html>
